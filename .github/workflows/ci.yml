name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Lint and test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -v

      - name: Check the committed CSV has all 1000 books
        run: |
          python - <<'PY'
          import csv
          rows = list(csv.DictReader(open("data/books.csv", encoding="utf-8")))
          assert len(rows) == 1000, len(rows)
          assert len({r["url"] for r in rows}) == 1000
          assert all(r["title"] and r["price_gbp"] and r["rating"] and r["availability"] and r["category"] for r in rows)
          print(f"OK: {len(rows)} books, {len({r['category'] for r in rows})} categories")
          PY
